<!DOCTYPE html>
<html lang="fi" data-theme="light" data-radius="pehmea" data-size="normaali">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auton Huoltokirja</title>
<meta name="description" content="Pidä kirjaa autojesi huolloista, korjauksista ja huoltoväleistä">
<meta name="theme-color" content="#5b60e3" id="themeColorMeta">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Huoltokirja">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* ============================================================
   1. TOKENIT  (K01-002)
   Kaikki värit, mitat ja varjot yhdessä paikassa.
   Teema, korostusväri, tekstikoko ja pyöristys tulevat
   asetuksista ja muuttavat näitä muuttujia ajossa.
   ============================================================ */
:root{
  color-scheme:light;

  --bg:#eef0f4;
  --surface:#ffffff;
  --surface-2:#f5f6f9;
  --surface-3:#eceef3;
  --border:#dfe3ea;
  --border-strong:#c9cfda;
  --text:#141920;
  --text-dim:#5b6573;
  --text-faint:#8b94a2;

  --accent:#5b60e3;
  --accent-soft:rgba(91,96,227,.12);
  --accent-line:rgba(91,96,227,.40);
  --accent-ink:#ffffff;

  --ok:#1f9254;       --ok-soft:rgba(31,146,84,.13);
  --soon:#b7791f;     --soon-soft:rgba(183,121,31,.15);
  --late:#c92c3c;     --late-soft:rgba(201,44,60,.13);

  --radius:12px;
  --radius-sm:8px;
  --radius-lg:18px;

  --shadow-1:0 1px 2px rgba(16,22,32,.06), 0 1px 1px rgba(16,22,32,.04);
  --shadow-2:0 2px 6px rgba(16,22,32,.07), 0 10px 26px rgba(16,22,32,.08);
  --shadow-3:0 18px 50px rgba(16,22,32,.22);

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:22px; --s6:32px; --s7:44px;

  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  --nav-h:62px;
  --bar-h:56px;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1116;
  --surface:#161a21;
  --surface-2:#1c212a;
  --surface-3:#232935;
  --border:#282f3a;
  --border-strong:#39424f;
  --text:#e7ebf1;
  --text-dim:#98a2b1;
  --text-faint:#6d7787;
  --ok:#41c97e;       --ok-soft:rgba(65,201,126,.14);
  --soon:#e8ae3f;     --soon-soft:rgba(232,174,63,.15);
  --late:#f2616f;     --late-soft:rgba(242,97,111,.14);
  --shadow-1:0 1px 2px rgba(0,0,0,.35);
  --shadow-2:0 2px 6px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.35);
  --shadow-3:0 20px 60px rgba(0,0,0,.6);
}
html[data-radius="terava"]{ --radius:4px; --radius-sm:3px; --radius-lg:6px; }
html[data-radius="pehmea"]{ --radius:12px; --radius-sm:8px; --radius-lg:18px; }
html[data-radius="pyorea"]{ --radius:20px; --radius-sm:14px; --radius-lg:28px; }
html[data-size="pieni"]{ font-size:14px; }
html[data-size="normaali"]{ font-size:16px; }
html[data-size="suuri"]{ font-size:18px; }
html[data-size="erittain"]{ font-size:20px; }

/* ============================================================
   2. PERUSTA
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:var(--sans);
  background:var(--bg);          /* K01-003: gradientti pois */
  color:var(--text);
  font-size:1rem;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.hide{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============================================================
   3. RUNKO
   ============================================================ */
#app{display:none;min-height:100vh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));}
#app.on{display:block}
.page{max-width:720px;margin:0 auto;padding:var(--s4) var(--s4) var(--s6)}
.view{display:none;animation:in .16s ease}
.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* --- yläpalkki --- */
.bar{
  position:sticky;top:0;z-index:30;height:var(--bar-h);
  background:var(--surface);
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:var(--s2);
  padding:0 var(--s3);
  padding-top:env(safe-area-inset-top);
  height:calc(var(--bar-h) + env(safe-area-inset-top));
}
.bar h1{font-size:1.0rem;font-weight:650;letter-spacing:-.01em;flex:0 0 auto}
.carpick{
  flex:1;min-width:0;display:flex;align-items:center;gap:var(--s2);
  padding:6px 10px;border-radius:var(--radius);border:1px solid var(--border);
  background:var(--surface-2);max-width:340px;
}
.carpick:hover{border-color:var(--border-strong)}
.carpick .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.carpick .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.87rem;font-weight:600;text-align:left}
.carpick .km{font-size:.72rem;color:var(--text-faint);font-variant-numeric:tabular-nums;flex:0 0 auto}
.bar .icon-btn{width:38px;height:38px;border-radius:var(--radius);display:grid;place-items:center;color:var(--text-dim);flex:0 0 auto}
.bar .icon-btn:hover{background:var(--surface-2);color:var(--text)}

/* --- alanavigaatio (K03-001) --- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:var(--surface);
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--border);
  display:grid;grid-template-columns:repeat(5,1fr);
}
.nav button{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--text-faint);font-size:.66rem;font-weight:600;letter-spacing:.005em;
  border-top:2px solid transparent;margin-top:-1px;
}
.nav button svg{width:21px;height:21px}
.nav button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
.nav .mid{position:relative}
.nav .mid .plus{
  width:40px;height:40px;border-radius:calc(var(--radius) + 4px);
  background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;box-shadow:var(--shadow-2);
}
.nav .mid[aria-current="page"] .plus{filter:brightness(.92)}

/* ============================================================
   4. KORTIT, NAPIT, LOMAKKEET
   ============================================================ */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:var(--s4);box-shadow:var(--shadow-1);
}
.card + .card{margin-top:var(--s3)}
.sec{margin-bottom:var(--s5)}
.sec-head{display:flex;align-items:baseline;gap:var(--s2);margin-bottom:var(--s3)}
.sec-head h2{font-size:.82rem;font-weight:700;color:var(--text-dim);letter-spacing:.01em;flex:1}
.sec-head .more{font-size:.78rem;color:var(--accent);font-weight:600}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  padding:11px 16px;border-radius:var(--radius);
  background:var(--surface-2);border:1px solid var(--border);
  font-size:.9rem;font-weight:600;color:var(--text);min-height:44px;
}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:translateY(1px)}
.btn-key{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-key:hover{filter:brightness(1.06);background:var(--accent)}
.btn-bad{color:var(--late);border-color:var(--border);border-color:color-mix(in srgb,var(--late) 35%,var(--border))}
.btn-bad:hover{background:var(--late-soft)}
.btn-quiet{background:none;border-color:transparent;color:var(--text-dim)}
.btn-quiet:hover{background:var(--surface-2);color:var(--text)}
.btn-full{width:100%}
.btn-sm{padding:7px 12px;min-height:36px;font-size:.82rem;border-radius:var(--radius-sm)}
.btn-row{display:flex;gap:var(--s2);flex-wrap:wrap}
.btn-row .btn{flex:1 1 auto}

.field{margin-bottom:var(--s3)}
.field label{display:block;font-size:.78rem;font-weight:650;color:var(--text-dim);margin-bottom:5px}
.field .help{font-size:.74rem;color:var(--text-faint);margin-top:5px}
input[type=text],input[type=number],input[type=date],input[type=email],
input[type=password],input[type=search],select,textarea{
  width:100%;padding:11px 12px;min-height:44px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
  font-size:.92rem;outline:none;
}
textarea{min-height:84px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input:disabled,select:disabled{opacity:.55}
.field.bad input,.field.bad textarea,.field.bad select{border-color:var(--late)}
.err{color:var(--late);font-size:.76rem;font-weight:600;margin-top:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}

.pillrow{display:flex;gap:6px;flex-wrap:wrap}
.pill{
  padding:8px 13px;border-radius:999px;border:1px solid var(--border);
  background:var(--surface);font-size:.82rem;font-weight:600;color:var(--text-dim);min-height:38px;
}
.pill:hover{border-color:var(--border-strong);color:var(--text)}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.tag{
  display:inline-block;padding:3px 9px;border-radius:999px;
  font-size:.68rem;font-weight:700;letter-spacing:.01em;
}
.t-huolto{background:var(--ok-soft);color:var(--ok)}
.t-korjaus{background:var(--soon-soft);color:var(--soon)}

/* ============================================================
   5. ETUSIVUN MITTARI
   ============================================================ */
.hero{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:var(--s5) var(--s4) var(--s4);box-shadow:var(--shadow-1);
  display:flex;gap:var(--s5);align-items:center;
}
.hero .gauge{flex:0 0 auto;position:relative;width:132px;height:80px}
.hero .gauge svg{display:block}
.hero .gauge .read{
  position:absolute;left:0;right:0;bottom:-2px;text-align:center;
}
.hero .gauge .read b{display:block;font-size:1.45rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.hero .gauge .read span{font-size:.68rem;color:var(--text-faint)}
.hero .info{flex:1;min-width:0}
.hero .info .lbl{font-size:.74rem;color:var(--text-faint);font-weight:600;margin-bottom:2px}
.hero .info h3{font-size:1.12rem;font-weight:700;letter-spacing:-.01em;margin-bottom:var(--s2);line-height:1.25}
.hero .info .meta{font-size:.82rem;color:var(--text-dim)}
.hero .info .meta b{font-variant-numeric:tabular-nums}
.st-ok{color:var(--ok)} .st-soon{color:var(--soon)} .st-late{color:var(--late)}
@media (max-width:420px){ .hero{flex-direction:column;gap:var(--s3);text-align:center} .hero .info{text-align:center} }

/* --- tilastoruudukko --- */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s2)}
@media(min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:var(--s3);text-align:left;
}
.stat b{display:block;font-size:1.22rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;color:var(--text-faint);font-weight:600}

/* ============================================================
   6. LISTAT
   ============================================================ */
.row{
  display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:var(--s3);margin-bottom:var(--s2);min-height:56px;
}
.row:hover{border-color:var(--border-strong)}
.row .lead{
  flex:0 0 auto;width:38px;height:38px;border-radius:var(--radius-sm);
  display:grid;place-items:center;background:var(--surface-2);color:var(--text-dim);
}
.row .body{flex:1;min-width:0}
.row .body b{display:block;font-size:.92rem;font-weight:650;line-height:1.3}
.row .body small{display:block;font-size:.76rem;color:var(--text-faint);margin-top:2px}
.row .trail{flex:0 0 auto;text-align:right;font-size:.82rem;color:var(--text-dim);font-variant-numeric:tabular-nums}

.entry{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:var(--s3) var(--s4);margin-bottom:var(--s2);
}
.entry .top{display:flex;align-items:center;gap:var(--s2);margin-bottom:6px}
.entry .top .date{font-size:.76rem;color:var(--text-faint);font-variant-numeric:tabular-nums}
.entry .top .sp{flex:1}
.entry .top .act{width:32px;height:32px;border-radius:var(--radius-sm);display:grid;place-items:center;color:var(--text-faint)}
.entry .top .act:hover{background:var(--surface-2);color:var(--text)}
.entry h4{font-size:1rem;font-weight:650;letter-spacing:-.005em;margin-bottom:4px;line-height:1.3}
.entry .facts{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s3);font-size:.8rem;color:var(--text-dim);margin-top:4px}
.entry .facts b{font-weight:650;color:var(--text);font-variant-numeric:tabular-nums}
.entry .desc{font-size:.85rem;color:var(--text-dim);margin-top:6px;white-space:pre-wrap;line-height:1.5}
.entry .cost{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}

/* --- huoltovälirivi --- */
.iv{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:var(--s3) var(--s4);margin-bottom:var(--s2);border-left:3px solid var(--border-strong);
}
.iv.ok{border-left-color:var(--ok)}
.iv.soon{border-left-color:var(--soon)}
.iv.late{border-left-color:var(--late)}
.iv .l1{display:flex;align-items:center;gap:var(--s2)}
.iv .l1 b{flex:1;font-size:.94rem;font-weight:650}
.iv .l1 .state{font-size:.76rem;font-weight:700}
.iv .l2{font-size:.78rem;color:var(--text-dim);margin-top:3px;font-variant-numeric:tabular-nums}
.iv .track{height:5px;border-radius:3px;background:var(--surface-3);margin-top:8px;overflow:hidden}
.iv .track i{display:block;height:100%;border-radius:3px;background:var(--ok);transition:width .3s}
.iv.soon .track i{background:var(--soon)}
.iv.late .track i{background:var(--late)}
.iv .acts{display:flex;gap:6px;margin-top:10px}

.empty{
  text-align:center;padding:var(--s6) var(--s4);color:var(--text-faint);
  border:1px dashed var(--border-strong);border-radius:var(--radius);background:var(--surface-2);
}
.empty b{display:block;font-size:.98rem;color:var(--text-dim);margin-bottom:5px;font-weight:650}
.empty p{font-size:.84rem;margin-bottom:var(--s3)}

/* ============================================================
   7. MODAALI, VALIKKO, ILMOITUKSET
   ============================================================ */
.veil{position:fixed;inset:0;z-index:60;background:rgba(8,11,16,.55);display:none;align-items:flex-end;justify-content:center}
.veil.on{display:flex}
@media(min-width:620px){.veil{align-items:center}}
.sheet{
  width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg) var(--radius-lg) 0 0;box-shadow:var(--shadow-3);
  animation:up .2s ease;
}
@media(min-width:620px){.sheet{border-radius:var(--radius-lg);animation:pop .16s ease}}
@keyframes up{from{transform:translateY(28px);opacity:.6}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;gap:var(--s2);padding:var(--s4);border-bottom:1px solid var(--border)}
.sheet-head h3{flex:1;font-size:1.02rem;font-weight:700}
.sheet-body{padding:var(--s4);overflow:auto;flex:1}
.sheet-foot{padding:var(--s3) var(--s4) calc(var(--s4) + env(safe-area-inset-bottom));border-top:1px solid var(--border);display:flex;gap:var(--s2)}
.sheet-foot .btn{flex:1}

.toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(10px);z-index:80;
  background:var(--text);color:var(--surface);
  padding:11px 18px;border-radius:999px;font-size:.86rem;font-weight:600;
  box-shadow:var(--shadow-2);opacity:0;pointer-events:none;transition:.2s;max-width:92vw;text-align:center;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.bad{background:var(--late);color:#fff}

/* päivitysbanneri (K17-003) */
.update{
  position:fixed;left:var(--s3);right:var(--s3);z-index:70;
  bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom));
  background:var(--accent);color:var(--accent-ink);
  border-radius:var(--radius);padding:var(--s3) var(--s4);
  display:none;align-items:center;gap:var(--s3);box-shadow:var(--shadow-2);
  max-width:560px;margin:0 auto;
}
.update.on{display:flex}
.update p{flex:1;font-size:.86rem;font-weight:600}
.update button{background:var(--accent-ink);color:var(--accent);padding:8px 14px;border-radius:var(--radius-sm);font-weight:700;font-size:.82rem;min-height:38px}

/* tallennuksen tila */
#saveDot{
  position:fixed;top:calc(env(safe-area-inset-top) + 8px);right:10px;z-index:50;
  font-size:.7rem;font-weight:700;padding:4px 10px;border-radius:999px;
  background:var(--surface-3);color:var(--text-dim);opacity:0;transition:opacity .3s;pointer-events:none;
}
#saveDot.on{opacity:1}

/* ============================================================
   8. ASETUKSET
   ============================================================ */
.set-group{margin-bottom:var(--s5)}
.set-group > h3{font-size:.78rem;font-weight:700;color:var(--text-faint);margin:0 0 var(--s2) 2px}
.set-item{
  display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);
  background:var(--surface);border:1px solid var(--border);border-bottom-width:0;
}
.set-item:first-of-type{border-radius:var(--radius) var(--radius) 0 0}
.set-item:last-of-type{border-radius:0 0 var(--radius) var(--radius);border-bottom-width:1px}
.set-item.only{border-radius:var(--radius);border-bottom-width:1px}
.set-item .txt{flex:1;min-width:0}
.set-item .txt b{display:block;font-size:.9rem;font-weight:600}
.set-item .txt small{display:block;font-size:.76rem;color:var(--text-faint);margin-top:2px;line-height:1.4}
.set-item .ctl{flex:0 0 auto}
.set-item.col{display:block}
.set-item.col .ctl{margin-top:var(--s3)}
.set-item select{min-height:38px;padding:6px 10px;width:auto;min-width:130px}

.sw{width:46px;height:27px;border-radius:999px;background:var(--border-strong);position:relative;transition:background .18s;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw[aria-pressed="true"]{background:var(--accent)}
.sw[aria-pressed="true"]::after{transform:translateX(19px)}

.swatches{display:flex;gap:9px;flex-wrap:wrap}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid transparent;position:relative}
.swatch[aria-pressed="true"]{border-color:var(--text)}
.swatch[aria-pressed="true"]::after{content:"";position:absolute;inset:4px;border-radius:50%;border:2px solid #fff}
.colorwrap{display:flex;align-items:center;gap:var(--s2)}
input[type=color]{width:46px;height:38px;padding:2px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface)}

.order-item{display:flex;align-items:center;gap:var(--s2);padding:10px var(--s3);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px}
.order-item b{flex:1;font-size:.86rem;font-weight:600}

<script type="module">
/* =================================================================
   AUTON HUOLTOKIRJA
   ================================================================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
         sendPasswordResetEmail, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const APP_VERSION = "2.0.0";

const firebaseConfig = {
  apiKey: "AIzaSyDswdEF9J0gsHJH6Zo_8BGZrf8DVG3FwYc",
  authDomain: "hakemuspaivakirja.firebaseapp.com",
  projectId: "hakemuspaivakirja",
  storageBucket: "hakemuspaivakirja.firebasestorage.app",
  messagingSenderId: "836133210317",
  appId: "1:836133210317:web:d85131ae272ecf1938c184"
};

const fb   = initializeApp(firebaseConfig);
const db   = getFirestore(fb);
const auth = getAuth(fb);
const LEGACY_DOC = doc(db, "huoltokirja", "data");   // vanha yhteinen dokumentti
let userDoc = null;                                   // huoltokirja/{uid}

/* =================================================================
   TILA
   ================================================================= */
let cars = [];
let currentCarId = null;
let settings = null;
let uid = null;
let saving = false;
let unsub = null;
let editingEntryId = null;
let view = "koti";

const DEF_SETTINGS = {
  theme: "system",
  palette: "oletus",
  accent: "",
  textSize: "normaali",
  radius: "pehmea",
  fields: { tyyppi:true, km:true, paikka:true, hinta:true, kuvaus:true },
  sections: [
    { id:"seuraava",    on:true },
    { id:"huoltovalit", on:true },
    { id:"tilastot",    on:true },
    { id:"viimeisimmat",on:true }
  ],
  lastBackup: null
};

const SECTION_NAMES = {
  seuraava:    "Seuraava huolto",
  huoltovalit: "Huoltovälien tila",
  tilastot:    "Tilastolaatikot",
  viimeisimmat:"Viimeisimmät merkinnät"
};

const PALETTES = {
  oletus:   { nimi:"Oletus",   accent:"#5b60e3" },
  yo:       { nimi:"Yö",       accent:"#7c8cff", pakotaTumma:true },
  metsa:    { nimi:"Metsä",    accent:"#2f9e63" },
  hiekka:   { nimi:"Hiekka",   accent:"#c2822f" },
  meri:     { nimi:"Meri",     accent:"#1789ad" },
  korjaamo: { nimi:"Korjaamo", accent:"#e0632c" }
};
const ACCENTS = ["#5b60e3","#7c8cff","#3b82f6","#1789ad","#0f9d8f","#2f9e63",
                 "#c2822f","#e0632c","#c92c3c","#d9448a","#8b5cf6","#64748b"];

/* Valmiit huoltovälit, joista voi poimia pohjan */
const IV_PRESETS = [
  { name:"Öljynvaihto ja suodattimet", months:12,  km:15000 },
  { name:"Raitisilmasuodatin",         months:12,  km:15000 },
  { name:"Määräaikaishuolto",          months:12,  km:20000 },
  { name:"Jarrunesteen vaihto",        months:24,  km:0 },
  { name:"Jakohihna",                  months:72,  km:90000 },
  { name:"Sytytystulpat",              months:48,  km:60000 },
  { name:"Katsastus",                  months:12,  km:0 },
  { name:"Ilmastointihuolto",          months:24,  km:0 },
  { name:"Renkaiden vaihto",           months:6,   km:0 },
  { name:"Jäähdytinneste",             months:60,  km:0 }
];

/* =================================================================
   PIKKUAPURIT
   ================================================================= */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const h  = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const uid4 = () => ((typeof crypto !== "undefined" && crypto.randomUUID) ? crypto.randomUUID()
  : Date.now().toString(36) + Math.random().toString(36).slice(2,9));
const nf  = n => new Intl.NumberFormat("fi-FI").format(Math.round(n||0));
const eur = n => new Intl.NumberFormat("fi-FI",{ style:"currency", currency:"EUR",
  minimumFractionDigits:(n%1?2:0), maximumFractionDigits:2 }).format(n||0);
const fdate = d => d ? new Date(d+"T00:00:00").toLocaleDateString("fi-FI") : "";
const today = () => new Date().toISOString().slice(0,10);

function toast(msg, bad){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.toggle("bad", !!bad);
  t.classList.add("on");
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove("on"), 2400);
}
function saveDot(msg, show){
  const d = $("#saveDot");
  d.textContent = msg;
  d.classList.toggle("on", show !== false);
  if(show !== false){ clearTimeout(d._t); d._t = setTimeout(()=> d.classList.remove("on"), 1600); }
}

/* --- modaali --- */
let sheetOnClose = null;
function sheet(title, bodyHtml, buttons, onClose){
  $("#sheetTitle").textContent = title;
  $("#sheetBody").innerHTML = bodyHtml;
  const foot = $("#sheetFoot");
  foot.innerHTML = "";
  (buttons||[]).forEach(b => {
    const el = document.createElement("button");
    el.className = "btn " + (b.cls||"");
    el.textContent = b.label;
    el.addEventListener("click", b.on);
    foot.appendChild(el);
  });
  foot.classList.toggle("hide", !(buttons||[]).length);
  sheetOnClose = onClose || null;
  $("#veil").classList.add("on");
}
function closeSheet(){
  $("#veil").classList.remove("on");
  if(sheetOnClose){ const f = sheetOnClose; sheetOnClose = null; f(); }
}
$("#sheetX").addEventListener("click", closeSheet);
$("#veil").addEventListener("click", e => { if(e.target === $("#veil")) closeSheet(); });
document.addEventListener("keydown", e => { if(e.key === "Escape" && $("#veil").classList.contains("on")) closeSheet(); });

function confirmSheet(title, text, okLabel, onOk, danger){
  sheet(title, `<p style="font-size:.92rem;line-height:1.55;color:var(--text-dim)">${h(text)}</p>`, [
    { label:"Peruuta", cls:"btn-quiet", on:closeSheet },
    { label:okLabel, cls: danger ? "btn-bad" : "btn-key", on:() => { closeSheet(); onOk(); } }
  ]);
}

/* =================================================================
   TEEMA JA ULKOASU  (K02-001…K02-007)
   ================================================================= */
const mq = window.matchMedia("(prefers-color-scheme: dark)");
function accentColor(){
  if(settings.accent) return settings.accent;
  return (PALETTES[settings.palette] || PALETTES.oletus).accent;
}
function hexRgb(hex){
  const x = hex.replace("#","");
  const v = x.length === 3 ? x.split("").map(c=>c+c).join("") : x;
  return [parseInt(v.slice(0,2),16), parseInt(v.slice(2,4),16), parseInt(v.slice(4,6),16)];
}
function applyLook(){
  const s = settings;
  const pal = PALETTES[s.palette] || PALETTES.oletus;
  let dark;
  if(s.theme === "dark") dark = true;
  else if(s.theme === "light") dark = false;
  else dark = mq.matches;
  if(pal.pakotaTumma && s.theme === "system") dark = true;

  const r = document.documentElement;
  r.dataset.theme  = dark ? "dark" : "light";
  r.dataset.radius = s.radius;
  r.dataset.size   = s.textSize;

  const a = accentColor();
  const [R,G,B] = hexRgb(a);
  const lum = (0.299*R + 0.587*G + 0.114*B) / 255;
  r.style.setProperty("--accent", a);
  r.style.setProperty("--accent-soft", `rgba(${R},${G},${B},${dark ? .18 : .12})`);
  r.style.setProperty("--accent-line", `rgba(${R},${G},${B},.42)`);
  r.style.setProperty("--accent-ink", lum > .62 ? "#151a20" : "#ffffff");
  $("#themeColorMeta").setAttribute("content", dark ? "#0e1116" : a);
}
mq.addEventListener("change", () => { if(settings && settings.theme === "system") applyLook(); });

/* =================================================================
   TALLENNUS JA LATAUS  (käyttäjäkohtainen polku users/{uid})
   ================================================================= */
function payload(){
  return {
    json: JSON.stringify(cars),
    settings: JSON.stringify(settings),
    lastCar: currentCarId || "",
    version: APP_VERSION,
    updatedAt: new Date().toISOString()
  };
}
let saveTimer = null;
function queueSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(save, 250); }

async function save(){
  if(!userDoc) return;
  saving = true;
  saveDot("Tallennetaan", true);
  try{
    try{ localStorage.setItem("huoltokirja_bkp_" + uid, JSON.stringify({ cars, settings })); }catch(e){}
    await setDoc(userDoc, payload());
    saveDot("Tallennettu", true);
  }catch(e){
    console.error(e);
    saveDot("Tallennus ei onnistunut", true);
    toast("Tallennus ei onnistunut. Tiedot ovat tallessa puhelimessa.", true);
  }
  setTimeout(()=>{ saving = false; }, 400);
}

function normalise(){
  cars = (cars||[]).filter(Boolean).map(c => ({
    id: c.id || uid4(),
    make: c.make || "", model: c.model || "",
    year: c.year || "", plate: c.plate || "",
    currentKm: Number(c.currentKm) || 0,
    entries: (c.entries||[]).map(e => ({
      id: String(e.id ?? uid4()),
      type: e.type === "korjaus" ? "korjaus" : "huolto",
      date: e.date || today(),
      km: Number(e.km) || 0,
      title: e.title || "Merkintä",
      desc: e.desc || "", place: e.place || "",
      cost: Number(e.cost) || 0,
      createdAt: e.createdAt || null,
      updatedAt: e.updatedAt || null
    })),
    intervals: (c.intervals||[]).map(i => ({
      id: i.id || uid4(),
      name: i.name || "Huoltoväli",
      months: Number(i.months) || 0,
      km: Number(i.km) || 0,
      lastDate: i.lastDate || "",
      lastKm: Number(i.lastKm) || 0,
      on: i.on !== false
    }))
  }));
  cars.forEach(c => { if(!c.currentKm) c.currentKm = maxKm(c); });
}

function mergeSettings(raw){
  const s = Object.assign({}, DEF_SETTINGS, raw||{});
  s.fields = Object.assign({}, DEF_SETTINGS.fields, (raw&&raw.fields)||{});
  const ids = DEF_SETTINGS.sections.map(x=>x.id);
  let secs = Array.isArray(raw&&raw.sections) ? raw.sections.filter(x=>x&&ids.includes(x.id)) : [];
  ids.forEach(id => { if(!secs.some(x=>x.id===id)) secs.push({ id, on:true }); });
  s.sections = secs;
  return s;
}

async function loadAll(){
  let loaded = false;
  try{
    const snap = await getDoc(userDoc);
    if(snap.exists()){
      const d = snap.data();
      cars = JSON.parse(d.json || "[]");
      settings = mergeSettings(d.settings ? JSON.parse(d.settings) : null);
      currentCarId = d.lastCar || null;
      loaded = true;
    }
  }catch(e){ console.warn("Oman datan luku epäonnistui", e); }

  /* Siirtymä vanhasta yhteisestä dokumentista omaan. Vanhaa ei poisteta. */
  if(!loaded && uid !== "data"){
    try{
      const old = await getDoc(LEGACY_DOC);
      if(old.exists()){
        cars = JSON.parse(old.data().json || "[]");
        currentCarId = old.data().lastCar || null;
        settings = mergeSettings(null);
        normalise();
        await save();
        toast("Tietosi siirrettiin omaan tiliisi.");
        loaded = true;
      }
    }catch(e){ console.warn("Vanhan dokumentin luku epäonnistui", e); }
  }

  if(!loaded){
    try{
      const bkp = localStorage.getItem("huoltokirja_bkp_" + uid)
               || localStorage.getItem("huoltokirja_bkp");
      if(bkp){
        const p = JSON.parse(bkp);
        cars = Array.isArray(p) ? p : (p.cars || []);
        settings = mergeSettings(p.settings);
      }
    }catch(e){}
  }
  if(!settings) settings = mergeSettings(null);
  normalise();
  applyLook();

  if(unsub) unsub();
  unsub = onSnapshot(userDoc, snap => {
    if(!snap.exists() || saving) return;
    try{
      const d = snap.data();
      cars = JSON.parse(d.json || "[]");
      if(d.settings) settings = mergeSettings(JSON.parse(d.settings));
      normalise(); applyLook(); render();
    }catch(e){}
  });
}

/* =================================================================
   APUFUNKTIOT AUTOILLE
   ================================================================= */
const car = () => cars.find(c => c.id === currentCarId) || null;
function maxKm(c){ return (c.entries||[]).reduce((m,e)=> Math.max(m, e.km||0), 0); }
function carKm(c){ return Math.max(Number(c.currentKm)||0, maxKm(c)); }
function carName(c){ return `${c.make} ${c.model}`.trim() + (c.year ? ` (${c.year})` : ""); }
function sortedEntries(c){ return (c.entries||[]).slice().sort((a,b)=>
  (b.date||"").localeCompare(a.date||"") || (b.km||0)-(a.km||0)); }

/* Arvio kuukaudessa ajetuista kilometreistä */
function kmPerMonth(c){
  const es = sortedEntries(c).filter(e=>e.km>0);
  if(es.length < 2) return 1200;
  const a = es[0], b = es[es.length-1];
  const days = (new Date(a.date) - new Date(b.date)) / 86400000;
  const dkm  = a.km - b.km;
  if(days < 25 || dkm <= 0) return 1200;
  return Math.max(150, Math.round(dkm / (days/30.4)));
}

/* =================================================================
   HUOLTOVÄLIT
   ================================================================= */
function addMonths(dateStr, m){
  const d = new Date(dateStr + "T00:00:00");
  const day = d.getDate();
  d.setMonth(d.getMonth() + m);
  if(d.getDate() < day) d.setDate(0);
  return d;
}
function ivStatus(c, iv){
  const now = new Date(today() + "T00:00:00");
  const km  = carKm(c);
  const per = kmPerMonth(c);
  const out = { days:null, kmLeft:null, pct:0, state:"ok", dueDate:null, dueKm:null, etaDays:null };

  if(iv.months > 0 && iv.lastDate){
    const due = addMonths(iv.lastDate, iv.months);
    out.dueDate = due;
    out.days = Math.round((due - now) / 86400000);
    const total = iv.months * 30.44;
    out.pct = Math.max(out.pct, Math.min(1, (total - out.days) / total));
  }
  if(iv.km > 0 && iv.lastKm > 0){
    out.dueKm  = iv.lastKm + iv.km;
    out.kmLeft = out.dueKm - km;
    out.pct = Math.max(out.pct, Math.min(1, (iv.km - out.kmLeft) / iv.km));
    out.etaDays = Math.round(out.kmLeft / (per/30.44));
  }
  const dLate = out.days !== null && out.days < 0;
  const kLate = out.kmLeft !== null && out.kmLeft < 0;
  const dSoon = out.days !== null && out.days <= 30;
  const kSoon = out.kmLeft !== null && out.kmLeft <= Math.max(500, iv.km*0.12);

  if(dLate || kLate) out.state = "late";
  else if(dSoon || kSoon) out.state = "soon";

  if(!iv.lastDate && !iv.lastKm){ out.state = "ok"; out.pct = 0; out.tuntematon = true; }
  return out;
}
function ivList(c){
  if(!c) return [];
  return (c.intervals||[]).filter(i => i.on !== false)
    .map(i => ({ iv:i, st:ivStatus(c,i) }))
    .sort((a,b) => {
      const rank = { late:0, soon:1, ok:2 };
      if(rank[a.st.state] !== rank[b.st.state]) return rank[a.st.state] - rank[b.st.state];
      const av = a.st.days ?? a.st.etaDays ?? 99999;
      const bv = b.st.days ?? b.st.etaDays ?? 99999;
      return av - bv;
    });
}
function ivText(st){
  const bits = [];
  if(st.tuntematon) return "Merkitse tehdyksi, niin laskenta alkaa";
  if(st.days !== null)   bits.push(st.days   < 0 ? `${Math.abs(st.days)} pv myöhässä`      : `${st.days} pv jäljellä`);
  if(st.kmLeft !== null) bits.push(st.kmLeft < 0 ? `${nf(Math.abs(st.kmLeft))} km yli`      : `${nf(st.kmLeft)} km jäljellä`);
  return bits.join(" · ");
}

}

function authError(code){
  const m = {
    "auth/invalid-credential":"Sähköposti tai salasana ei täsmää.",
    "auth/wrong-password":"Sähköposti tai salasana ei täsmää.",
    "auth/user-not-found":"Tunnusta ei löytynyt.",
    "auth/invalid-email":"Tarkista sähköpostiosoite.",
    "auth/too-many-requests":"Liian monta yritystä. Odota hetki.",
    "auth/weak-password":"Salasanassa pitää olla vähintään 6 merkkiä.",
    "auth/email-already-in-use":"Tälle sähköpostille on jo tili.",
    "auth/network-request-failed":"Ei verkkoyhteyttä."
  };
  return m[code] || ("Kirjautuminen ei onnistunut (" + code + ")");
}
async function doAuth(mode){
  const email = $("#email").value.trim();
  const pw    = $("#pw").value;
  const err   = $("#loginErr");
  const btn   = $("#loginBtn");
  err.textContent = "";
  if(!email){ err.textContent = "Syötä sähköposti."; return; }
  if(mode !== "reset" && !pw){ err.textContent = "Syötä salasana."; return; }
  btn.disabled = true;
  try{
    if(mode === "login")      await signInWithEmailAndPassword(auth, email, pw);
    else if(mode === "reg")   await createUserWithEmailAndPassword(auth, email, pw);
    else { await sendPasswordResetEmail(auth, email); err.textContent = ""; toast("Palautuslinkki lähetetty sähköpostiin."); }
  }catch(e){ err.textContent = authError(e.code); }
  btn.disabled = false;
}
$("#loginBtn").addEventListener("click", () => doAuth("login"));
$("#regBtn").addEventListener("click", () => doAuth("reg"));
$("#resetBtn").addEventListener("click", () => doAuth("reset"));
$("#pw").addEventListener("keydown", e => { if(e.key === "Enter") doAuth("login"); });

onAuthStateChanged(auth, async user => {

    userDoc = doc(db, "huoltokirja", uid);
    await loadAll();
    $("#login").classList.add("hide");

  }else{

    if(unsub){ unsub(); unsub = null; }

    $("#login").classList.remove("hide");

  }
});

function gauge(pct, state){
  const R = 56, CX = 66, CY = 68;
  const len = Math.PI * R;
  const on  = Math.max(0, Math.min(1, pct)) * len;
  const col = state === "late" ? "var(--late)" : state === "soon" ? "var(--soon)" : "var(--ok)";
  return `<svg width="132" height="80" viewBox="0 0 132 80" aria-hidden="true">
    <path d="M ${CX-R} ${CY} A ${R} ${R} 0 0 1 ${CX+R} ${CY}" fill="none"
      stroke="var(--surface-3)" stroke-width="11" stroke-linecap="round"/>
    <path d="M ${CX-R} ${CY} A ${R} ${R} 0 0 1 ${CX+R} ${CY}" fill="none"
      stroke="${col}" stroke-width="11" stroke-linecap="round"
      stroke-dasharray="${on.toFixed(1)} ${len.toFixed(1)}"/>
  </svg>`;
}

function secSeuraava(c){
  const list = ivList(c);
  const first = list.find(x => !x.st.tuntematon) || list[0];
  if(!first){
    return `<div class="sec"><div class="hero">
      <div class="gauge">${gauge(0,"ok")}<div class="read"><b>–</b><span>ei väliä</span></div></div>
      <div class="info">
        <div class="lbl">Seuraava huolto</div>
        <h3>Huoltovälejä ei ole vielä asetettu</h3>
        <div class="meta">Lisää esimerkiksi öljynvaihto 12 kuukauden välein, niin sovellus pitää kirjaa puolestasi.</div>
        <button class="btn btn-key btn-sm" id="heroAddIv" style="margin-top:12px">Lisää huoltoväli</button>
      </div></div></div>`;
  }
  const st = first.st;
  const big = st.days !== null ? Math.abs(st.days) : (st.kmLeft !== null ? Math.abs(st.kmLeft) : 0);
  const unit = st.days !== null ? (st.days < 0 ? "pv myöhässä" : "päivää") : (st.kmLeft < 0 ? "km yli" : "km");
  const cls = "st-" + st.state;
  return `<div class="sec"><div class="hero">
    <div class="gauge">${gauge(st.pct, st.state)}
      <div class="read"><b class="${cls}">${st.tuntematon ? "–" : nf(big)}</b><span>${h(unit)}</span></div></div>
    <div class="info">
      <div class="lbl">Seuraava huolto</div>
      <h3>${h(first.iv.name)}</h3>
      <div class="meta ${cls}" style="font-weight:600">${h(ivText(st))}</div>
      <div class="meta" style="margin-top:4px">${
        st.dueDate ? "Eräpäivä " + st.dueDate.toLocaleDateString("fi-FI") : ""}${
        st.dueDate && st.dueKm ? " · " : ""}${
        st.dueKm ? "Kilometreissä " + nf(st.dueKm) : ""}</div>
      <button class="btn btn-sm" data-done="${first.iv.id}" style="margin-top:12px">Merkitse tehdyksi</button>
    </div></div></div>`;
}

function secHuoltovalit(c){

function secTilastot(c){

/* ---------------- HUOLTOVÄLIT ---------------- */
function ivManage(){
  const c = car();
  if(!c){ toast("Valitse ensin auto", true); return; }
  const list = ivList(c);
  const body = (c.intervals||[]).length
    ? list.map(({iv,st}) => `<button class="row" data-iv="${h(iv.id)}">
        <span class="lead" style="background:var(--${st.state === "late" ? "late" : st.state === "soon" ? "soon" : "ok"}-soft);color:var(--${st.state === "late" ? "late" : st.state === "soon" ? "soon" : "ok"})">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg></span>

          } · ${h(ivText(st))}</small></span></button>`).join("")
    : `<p class="note">Ei vielä huoltovälejä. Lisää esimerkiksi öljynvaihto 12 kuukauden tai 15 000 kilometrin välein, niin sovellus laskee seuraavan ajankohdan puolestasi.</p>`;

  sheet("Huoltovälit", body, [

function markDone(ivId){

function openEntryForm(id){

  $("#eTitle").value = e?.title || "";

  $("#ePlace").value = e?.place || "";
  $("#eCost").value  = e?.cost ? String(e.cost).replace(".", ",") : "";

  $("#titleHints").innerHTML = titles.map(t => `<option value="${h(t)}">`).join("");

    ? `<div class="field" style="margin-bottom:0"><label>Kuittaa huoltoväli tehdyksi</label>

    : "";

    b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true")));

$("#entryCancel").addEventListener("click", () => { editingEntryId = null; go("koti"); });

function fieldError(sel, msg){
  const f = $(sel);
  f.classList.add("bad");
  if(!f.querySelector(".err")){
    const d = document.createElement("div");
    d.className = "err"; d.textContent = msg; f.appendChild(d);
  }
}
$("#entrySave").addEventListener("click", () => {
  const c = car(); if(!c) return;
  $$(".field").forEach(f => { f.classList.remove("bad"); const x = f.querySelector(".err"); if(x) x.remove(); });

  const date  = $("#eDate").value;
  const kmRaw = $("#eKm").value;
  const title = $("#eTitle").value.trim();
  let bad = false;
  if(!date){  fieldError("#f-date", "Valitse päivämäärä."); bad = true; }
  if(!kmRaw){ fieldError("#f-km", "Syötä mittarilukema."); bad = true; }
  if(!title){ fieldError("#f-title", "Anna merkinnälle otsikko."); bad = true; }
  if(bad){ toast("Täytä puuttuvat kohdat", true); return; }

  const km = parseInt(kmRaw,10) || 0;
  const cost = parseFloat(String($("#eCost").value).replace(/\s/g,"").replace(",",".")) || 0;
  const data = { type:$('#eType .pill[aria-pressed="true"]').dataset.v, date, km, title,
                 desc:$("#eDesc").value.trim(), place:$("#ePlace").value.trim(), cost };

  if(editingEntryId){
    const e = c.entries.find(x => x.id === editingEntryId);
    Object.assign(e, data, { updatedAt:new Date().toISOString() });
  }else{
    c.entries.push(Object.assign({ id:uid4(), createdAt:new Date().toISOString(), updatedAt:null }, data));
    $$('#ivLink .pill[aria-pressed="true"]').forEach(b => {
      const iv = c.intervals.find(x => x.id === b.dataset.ivl);
      if(iv){ iv.lastDate = date; iv.lastKm = km; }
    });
  }
  if(km > (c.currentKm||0)) c.currentKm = km;

  queueSave();
  toast(editingEntryId ? "Merkintä päivitetty" : "Merkintä lisätty");
  editingEntryId = null;
  go("koti");
});

function delEntry(id){
  const c = car(); if(!c) return;
  const e = c.entries.find(x => x.id === id); if(!e) return;
  confirmSheet("Poista merkintä", `Poistetaanko "${e.title}" ${fdate(e.date)}?`, "Poista", () => {
    c.entries = c.entries.filter(x => x.id !== id);
    queueSave(); render(); toast("Merkintä poistettu");

}

let histQ = "", histType = "kaikki";
$("#histSearch").addEventListener("input", e => { histQ = e.target.value.trim().toLowerCase(); renderHist(); });
$$("#histFilter .pill").forEach(p => p.addEventListener("click", () => {
  histType = p.dataset.v;
  $$("#histFilter .pill").forEach(x => x.setAttribute("aria-pressed", x === p));
  renderHist();
}));

function renderTilastot(){
  const c = car();
  if(!c){
    $("#statsGrid").innerHTML = "";
    $("#yearBox").innerHTML = "";
    $("#histList").innerHTML = needCar("Valitse auto nähdäksesi tilastot.");
    $("#histCount").textContent = "";
    return;
  }
  const es = c.entries || [];
  const total = es.reduce((s,e)=>s+(e.cost||0),0);
  const avg   = es.length ? total/es.length : 0;
  const top = es.reduce((m,e)=> (e.cost||0) > (m?.cost||0) ? e : m, null);
  $("#statsGrid").innerHTML = `
    <div class="stat"><b>${es.length}</b><span>merkintää</span></div>
    <div class="stat"><b>${eur(total)}</b><span>kulut yhteensä</span></div>
    <div class="stat"><b>${eur(avg)}</b><span>keskihinta</span></div>
    <div class="stat"><b>${eur(top?.cost||0)}</b><span>kallein merkintä</span></div>`;

  const years = {};
  es.forEach(e => { const y = (e.date||"").slice(0,4); if(y) years[y] = (years[y]||0) + (e.cost||0); });
  const keys = Object.keys(years).sort().reverse();
  const max = Math.max(1, ...Object.values(years));
  $("#yearBox").innerHTML = keys.length ? keys.map(y => `
    <div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:4px">
        <span style="color:var(--text-dim);font-weight:600">${y}</span><b style="font-variant-numeric:tabular-nums">${eur(years[y])}</b></div>
      <div class="track" style="height:7px;background:var(--surface-3);border-radius:4px;overflow:hidden">
        <i style="display:block;height:100%;width:${Math.round(years[y]/max*100)}%;background:var(--accent);border-radius:4px"></i></div>
    </div>`).join("")
    : `<p style="color:var(--text-faint);font-size:.86rem">Ei vielä kuluja.</p>`;

  renderHist();
}
function renderHist(){
  const c = car(); if(!c) return;
  let es = sortedEntries(c);
  if(histType !== "kaikki") es = es.filter(e => e.type === histType);
  if(histQ) es = es.filter(e =>
    (e.title||"").toLowerCase().includes(histQ) ||
    (e.desc||"").toLowerCase().includes(histQ) ||
    (e.place||"").toLowerCase().includes(histQ));
  $("#histCount").textContent = es.length + " kpl";
  $("#histList").innerHTML = es.length
    ? es.map(entryCard).join("")
    : `<div class="empty"><b>Ei osumia</b><p>${histQ ? "Kokeile toista hakusanaa." : "Ei merkintöjä tällä suodattimella."}</p></div>`;
  wireEntryCards("#histList");
}

let setQ = "";
$("#setSearch").addEventListener("input", e => { setQ = e.target.value.trim().toLowerCase(); filterSettings(); });
function filterSettings(){
  let shown = 0;
  $$("#setBody .set-group").forEach(g => {
    let vis = 0;
    g.querySelectorAll(".set-item").forEach(it => {
      const hay = (it.dataset.k + " " + it.textContent).toLowerCase();
      const ok = !setQ || hay.includes(setQ);
      it.classList.toggle("hide", !ok);
      if(ok) vis++;
    });
    g.classList.toggle("hide", vis === 0);
    shown += vis;
  });
  $("#setEmpty").classList.toggle("hide", shown > 0);
}

function saveSettings(){ queueSave(); applyLook(); }

function wireAsetukset(){
  $("#setTheme").addEventListener("change", e => { settings.theme = e.target.value; saveSettings(); });
  $("#setSize").addEventListener("change", e => { settings.textSize = e.target.value; saveSettings(); });
  $("#setRadius").addEventListener("change", e => { settings.radius = e.target.value; saveSettings(); });

  $$("#setPal .pill").forEach(b => b.addEventListener("click", () => {
    settings.palette = b.dataset.p; settings.accent = "";
    saveSettings(); renderAsetukset();
  }));
  $$("#setAcc .swatch").forEach(b => b.addEventListener("click", () => {
    settings.accent = b.dataset.a; saveSettings(); renderAsetukset();
  }));
  $("#setAccCustom").addEventListener("input", e => { settings.accent = e.target.value; applyLook(); });
  $("#setAccCustom").addEventListener("change", () => { saveSettings(); renderAsetukset(); });
  $("#setAccReset").addEventListener("click", () => { settings.accent = ""; saveSettings(); renderAsetukset(); });

  $$("#setSec [data-up]").forEach(b => b.addEventListener("click", () => {
    const i = +b.dataset.up; const a = settings.sections;
    [a[i-1], a[i]] = [a[i], a[i-1]]; saveSettings(); renderAsetukset();
  }));
  $$("#setSec [data-down]").forEach(b => b.addEventListener("click", () => {
    const i = +b.dataset.down; const a = settings.sections;
    [a[i+1], a[i]] = [a[i], a[i+1]]; saveSettings(); renderAsetukset();
  }));
  $$("#setSec [data-sec]").forEach(b => b.addEventListener("click", () => {
    const sec = settings.sections.find(x => x.id === b.dataset.sec);
    sec.on = !sec.on; b.setAttribute("aria-pressed", sec.on ? "true":"false"); saveSettings();
  }));

  [["fTyyppi","tyyppi"],["fKm","km"],["fPaikka","paikka"],["fHinta","hinta"],["fKuvaus","kuvaus"]]
    .forEach(([id,key]) => $("#"+id).addEventListener("click", () => {
      settings.fields[key] = !settings.fields[key];
      $("#"+id).setAttribute("aria-pressed", settings.fields[key] ? "true":"false");
      saveSettings();
    }));

  $("#expJson").addEventListener("click", () => exportJson(cars, "huoltokirja", true));
  $("#expCsvCar").addEventListener("click", () => { const c = car(); c ? exportCsv(c) : toast("Valitse ensin auto", true); });
  $("#expCsvAll").addEventListener("click", () => exportCsv(null));
  $("#impJson").addEventListener("click", () => pickFile("data"));
  $("#expSet").addEventListener("click", exportSettings);
  $("#impSet").addEventListener("click", () => pickFile("settings"));
  $("#outBtn").addEventListener("click", () => confirmSheet("Kirjaudu ulos", "Haluatko kirjautua ulos?", "Kirjaudu ulos", () => signOut(auth), true));
  $("#chkUpd").addEventListener("click", checkUpdate);
  $("#resetSet").addEventListener("click", () => confirmSheet("Palauta asetukset",
    "Ulkoasu, etusivun järjestys ja näkyvät kentät palautuvat oletuksiin. Autot ja merkinnät säilyvät.",
    "Palauta", () => { settings = mergeSettings(null); saveSettings(); renderAsetukset(); toast("Asetukset palautettu"); }, true));
}

/* =================================================================
   VIENTI  (K23-001, K23-002, K23-024, K23-025, K23-026)
   ================================================================= */
function dl(text, name, mime){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type:(mime||"text/plain") + ";charset=utf-8" }));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
/* Kentän suojaus: lainausmerkit, puolipisteet ja rivinvaihdot eivät riko tiedostoa */
function cell(v){
  const s = String(v ?? "");
  return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function exportCsv(only){
  const list = only ? [only] : cars;
  const rows = [];
  const head = only
    ? ["Päivämäärä","Tyyppi","Otsikko","Kilometrit","Paikka","Hinta (€)","Kuvaus"]
    : ["Auto","Rekisteri","Päivämäärä","Tyyppi","Otsikko","Kilometrit","Paikka","Hinta (€)","Kuvaus"];
  rows.push(head.map(cell).join(";"));
  let n = 0;
  list.forEach(c => sortedEntries(c).forEach(e => {
    const base = [e.date, e.type, e.title, e.km, e.place||"", String(e.cost||0).replace(".",","), e.desc||""];
    rows.push((only ? base : [carName(c), c.plate||"", ...base]).map(cell).join(";"));
    n++;
  }));
  if(!n){ toast("Ei merkintöjä vietäväksi", true); return; }
  const name = only ? `${only.make}_${only.model}_${today()}.csv` : `huoltokirja_kaikki_${today()}.csv`;
  dl("\uFEFF" + rows.join("\r\n"), name.replace(/\s+/g,"_"), "text/csv");
  toast(`${n} merkintää viety`);
}
function exportJson(list, base, isBackup){
  const doc = {
    sovellus: "Auton Huoltokirja",
    versio: APP_VERSION,
    viety: new Date().toISOString(),
    autoja: list.length,
    merkintoja: list.reduce((s,c)=>s+(c.entries||[]).length,0),
    asetukset: settings,
    autot: list
  };
  dl(JSON.stringify(doc, null, 2), `${base}_${today()}.json`.replace(/\s+/g,"_"), "application/json");
  if(isBackup){ settings.lastBackup = new Date().toISOString(); queueSave(); renderAsetukset(); }
  toast("Tiedosto ladattu");
}
function exportSettings(){
  dl(JSON.stringify({ sovellus:"Auton Huoltokirja", versio:APP_VERSION, tyyppi:"asetukset",
    viety:new Date().toISOString(), asetukset:settings }, null, 2),
    `huoltokirja_asetukset_${today()}.json`, "application/json");
  toast("Asetukset viety");
}

/* =================================================================
   TUONTI  (K23-003 esikatselu, K23-004 yhdistäminen)
   ================================================================= */
let pickMode = "data";
function pickFile(mode){ pickMode = mode; $("#filePick").value = ""; $("#filePick").click(); }
$("#filePick").addEventListener("change", e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ev => { try{ handleImport(JSON.parse(ev.target.result), f); }
                     catch(err){ toast("Tiedostoa ei voitu lukea", true); } };
  r.readAsText(f);
});

function handleImport(data, file){
  if(pickMode === "settings"){
    const s = data.asetukset || data;
    if(!s || typeof s !== "object"){ toast("Tämä ei näytä asetustiedostolta", true); return; }
    confirmSheet("Tuo asetukset", "Nykyiset ulkoasu- ja näkymäasetukset korvataan. Autot ja merkinnät säilyvät.",
      "Tuo", () => { settings = mergeSettings(s); saveSettings(); renderAsetukset(); toast("Asetukset tuotu"); });
    return;
  }

  const incoming = Array.isArray(data) ? data : (data.autot || data.cars);
  if(!Array.isArray(incoming)){ toast("Tiedostosta ei löytynyt autoja", true); return; }

  const clean = incoming.filter(Boolean).map(c => ({
    id: c.id || uid4(), make:c.make||"", model:c.model||"", year:c.year||"", plate:c.plate||"",
    currentKm:Number(c.currentKm)||0,
    entries:(c.entries||[]).map(x => ({ id:String(x.id ?? uid4()), type:x.type==="korjaus"?"korjaus":"huolto",
      date:x.date||today(), km:Number(x.km)||0, title:x.title||"Merkintä", desc:x.desc||"",
      place:x.place||"", cost:Number(x.cost)||0, createdAt:x.createdAt||null, updatedAt:x.updatedAt||null })),
    intervals:(c.intervals||[]).map(i => ({ id:i.id||uid4(), name:i.name||"Huoltoväli",
      months:Number(i.months)||0, km:Number(i.km)||0, lastDate:i.lastDate||"",
      lastKm:Number(i.lastKm)||0, on:i.on!==false }))
  }));

  const nEntries = clean.reduce((s,c)=>s+c.entries.length,0);
  const nIv = clean.reduce((s,c)=>s+c.intervals.length,0);
  const names = clean.map(c => carName(c)).slice(0,6);

  const body = `
    <p class="note">${h(file.name)}${data.viety ? " · viety " + new Date(data.viety).toLocaleString("fi-FI") : ""}</p>
    <div class="diff">
      <span class="k">Autoja tiedostossa</span><span class="v">${clean.length}</span>
      <span class="k">Merkintöjä</span><span class="v">${nEntries}</span>
      <span class="k">Huoltovälejä</span><span class="v">${nIv}</span>
      <span class="k">Nykyisiä autoja</span><span class="v">${cars.length}</span>
      <span class="k">Nykyisiä merkintöjä</span><span class="v">${cars.reduce((s,c)=>s+(c.entries||[]).length,0)}</span>
    </div>
    <p style="font-size:.82rem;color:var(--text-dim);margin-top:12px">${h(names.join(", "))}${clean.length > 6 ? " ja muita" : ""}</p>
    <p class="note" style="margin-top:14px"><b>Yhdistä</b> lisää puuttuvat autot ja merkinnät nykyisten rinnalle.
      <b>Korvaa</b> poistaa kaikki nykyiset tiedot ja käyttää tiedoston sisältöä.</p>
    ${data.asetukset ? `<p class="note" style="margin-top:8px">Tiedostossa on myös asetukset. Ne otetaan käyttöön vain korvattaessa.</p>` : ""}`;

  sheet("Tuonnin esikatselu", body, [
    { label:"Peruuta", cls:"btn-quiet", on:closeSheet },
    { label:"Yhdistä", cls:"", on:() => { closeSheet(); doMerge(clean); } },
    { label:"Korvaa", cls:"btn-bad", on:() => {
        closeSheet();
        confirmSheet("Korvaa kaikki", `Nykyiset ${cars.length} autoa ja ${cars.reduce((s,c)=>s+(c.entries||[]).length,0)} merkintää poistetaan.`,
          "Korvaa", () => {
            cars = clean;
            if(data.asetukset) settings = mergeSettings(data.asetukset);
            currentCarId = cars[0]?.id || null;
            normalise(); saveSettings(); render();
            toast(`${clean.length} autoa tuotu`);
          }, true);
      } }
  ]);
}

function doMerge(incoming){
  let nc = 0, ne = 0, ni = 0;
  incoming.forEach(ic => {
    let ex = cars.find(c => c.id === ic.id)
      || (ic.plate && cars.find(c => (c.plate||"") && c.plate === ic.plate))
      || cars.find(c => c.make === ic.make && c.model === ic.model && String(c.year||"") === String(ic.year||""));
    if(!ex){ cars.push(ic); nc++; return; }
    ic.entries.forEach(e => {
      const dup = ex.entries.some(x => x.id === e.id ||
        (x.date === e.date && x.km === e.km && (x.title||"").toLowerCase() === (e.title||"").toLowerCase()));
      if(!dup){ ex.entries.push(e); ne++; }
    });
    ic.intervals.forEach(i => {
      const dup = (ex.intervals||[]).some(x => x.id === i.id ||
        (x.name||"").toLowerCase() === (i.name||"").toLowerCase());
      if(!dup){ ex.intervals = ex.intervals || []; ex.intervals.push(i); ni++; }
    });
    ex.currentKm = Math.max(ex.currentKm||0, ic.currentKm||0);
  });
  if(!currentCarId) currentCarId = cars[0]?.id || null;
  normalise(); queueSave(); render();
  toast(`Yhdistetty: ${nc} autoa, ${ne} merkintää, ${ni} huoltoväliä`);
}

/* =================================================================
   SERVICE WORKER JA PÄIVITYS  (K17-001, K17-003)
   ================================================================= */
let waitingWorker = null;
let reloading = false;

function showUpdate(w){
  waitingWorker = w;
  $("#updateBar").classList.add("on");
}
$("#updateBtn").addEventListener("click", () => {
  if(!waitingWorker) { location.reload(); return; }
  waitingWorker.postMessage({ type:"SKIP_WAITING" });
  $("#updateBtn").textContent = "Päivitetään…";
});

async function checkUpdate(){
  if(!("serviceWorker" in navigator)){ toast("Päivitys ei ole käytettävissä", true); return; }
  const reg = await navigator.serviceWorker.getRegistration();
  if(!reg){ toast("Ei asennettua taustapalvelua", true); return; }
  toast("Tarkistetaan…");
  await reg.update();
  setTimeout(() => {
    if(reg.waiting) showUpdate(reg.waiting);
    else toast("Käytössä on uusin versio");
  }, 1200);
}

if("serviceWorker" in navigator){
  window.addEventListener("load", async () => {
    try{
      const reg = await navigator.serviceWorker.register("sw.js");
      if(reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
      reg.addEventListener("updatefound", () => {
        const nw = reg.installing;
        if(!nw) return;
        nw.addEventListener("statechange", () => {
          if(nw.state === "installed" && navigator.serviceWorker.controller) showUpdate(nw);
        });
      });
      setInterval(() => reg.update().catch(()=>{}), 60*60*1000);
    }catch(e){ console.warn("Service worker ei rekisteröitynyt", e); }
  });
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if(reloading) return;
    reloading = true;
    location.reload();
  });
}

/* PWA-asennus */
let installPrompt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installPrompt = e; });
